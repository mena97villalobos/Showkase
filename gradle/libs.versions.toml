[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.7"

androidXTestCore = "1.7.0"
androidXTestRules = "1.7.0"
appcompat = "1.7.1"
assertJ = "3.27.7"
compose = "1.11.1"
composeActivity = "1.13.0"
composeConstraintLayout = "1.1.1"
composeMaterial3 = "1.4.0"
composeMaterialIcons = "1.7.8"
composeNavigation = "2.9.8"
corektx = "1.18.0"
detekt = "1.23.8"
googleTruth = "1.4.5"
junit = "4.13.2"
junitImplementation = "1.3.0"
kotlinCompileTesting = "0.12.1"
kotlinPoet = "2.3.0"
lifecycle = "2.10.0"
material = "1.13.0"
mavenPublish = "0.36.0"
picasso = "2.71828"
roborazzi = "1.60.0"
robolectric = "4.14.1"
shot = "6.1.0"
strikt = "0.35.1"
testParameterInjector = "1.22"
testRunner = "1.7.0"

[libraries]
# Compose
compose-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "composeActivity" }
compose-composeNavigation = { module = "androidx.navigation:navigation-compose", version.ref = "composeNavigation" }
compose-composeRuntime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-constraintLayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "composeConstraintLayout" }
compose-core = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-layout = { module = "androidx.compose.foundation:foundation-layout", version.ref = "compose" }
compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
compose-materialIconsCore = { module = "androidx.compose.material:material-icons-core", version.ref = "composeMaterialIcons" }
compose-savedInstanceState = { module = "androidx.compose.runtime:runtime-saveable", version.ref = "compose" }
compose-uiTest = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-uiLiveData = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose" }

# Kotlin tooling
kotlinCompileTesting = { module = "dev.zacsweers.kctfork:core", version.ref = "kotlinCompileTesting" }
kotlinCompileTestingKsp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kotlinCompileTesting" }
kotlinPoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinPoet" }
kotlinJavaPoetInterop = { module = "com.squareup:kotlinpoet-javapoet", version.ref = "kotlinPoet" }
kotlinPoetKsp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinPoet" }
kotlinXMetadata = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
ksp = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

# Image loading
imageLoading-picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }

# Support
support-appCompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
support-ktx = { module = "androidx.core:core-ktx", version.ref = "corektx" }
support-lifecycleComposeViewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
support-lifecycleComposeRuntime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Test
test-androidXTestCore = { module = "androidx.test:core", version.ref = "androidXTestCore" }
test-androidXTestRules = { module = "androidx.test:rules", version.ref = "androidXTestRules" }
test-androidxTestRunner = { module = "androidx.test:runner", version.ref = "testRunner" }
test-assertJ = { module = "org.assertj:assertj-core", version.ref = "assertJ" }
test-googleTruth = { module = "com.google.truth:truth", version.ref = "googleTruth" }
test-junit = { module = "junit:junit", version.ref = "junit" }
test-junitImplementation = { module = "androidx.test.ext:junit", version.ref = "junitImplementation" }
test-roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
test-roborazziCompose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
test-roborazziJunitRule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
test-robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-shotAndroid = { module = "com.karumi:shot-android", version.ref = "shot" }
test-strikt = { module = "io.strikt:strikt-core", version.ref = "strikt" }
test-testParameterInjector = { module = "com.google.testparameterinjector:test-parameter-injector", version.ref = "testParameterInjector" }

# Material
material-material = { module = "com.google.android.material:material", version.ref = "material" }

# Detekt formatting
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
shot = { id = "shot", version.ref = "shot" }
